name: College ERP CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check application files
        run: |
          test -f index.html
          echo "Application file found successfully"

      - name: Validate HTML content
        run: |
          grep -q "College ERP System" index.html
          echo "HTML validation successful"

      - name: Complete pipeline
        run: echo "Build, test and deployment stages completed"
